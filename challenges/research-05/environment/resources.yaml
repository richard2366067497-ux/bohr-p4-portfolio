# environment/resources.yaml — research-05 / research-topic-innovation-eval (v9)
# Resource entry declaration. Pure standard library, offline, deterministic.
skill: research-topic-innovation-eval
version: 1.0.0
lang: python
python: ">=3.9"

entry:
  single_command: >-
    python3 /skills/weekly-skill/scripts/main.py all
    --input /input --output /app/output --work /app/work
  agent_first:
    - python3 /skills/weekly-skill/scripts/main.py init --input /input --output /app/output --work /app/work
    - "Agent: run show, read the material with its M#/p# locators, write /app/work/draft.json (SKILL.md section 1)"
    - python3 /skills/weekly-skill/scripts/main.py check --input /input --output /app/output --work /app/work
    - python3 /skills/weekly-skill/scripts/main.py build --input /input --output /app/output --work /app/work
    - python3 /skills/weekly-skill/scripts/main.py compare --input /input --output /app/output --work /app/work
  selftest: >-
    python3 /skills/weekly-skill/scripts/main.py selfcheck
    --output /app/output --work /app/work

scripts:
  - scripts/main.py       # CLI + orchestration: all / init / show / check / build / selfcheck / compare
  - scripts/kglib.py      # engine: scan, material resolution, five gates, conflicts, evidence, contract echo
  - scripts/extract.py    # parsing: section-by-section rule extraction (gates/thresholds/codes/enums) with locators
  - scripts/render.py     # writers: scorecard / matrix / evidence index / brief / self-check / result.json

paths:
  input: /input
  output: /app/output
  work: /app/work
  skill_root: /skills/weekly-skill

inputs:
  rule_material: "markdown carrying the five gates, the verdict thresholds, the E_*/W_* codes, the enums, the evidence-match modes, the object-table steps and the out-of-scope boundaries"
  field_dictionary: "markdown carrying the draft field dictionary (top-level fields, matrix long-table fields, the minimal draft sample)"
  draft: "optional /app/work/draft.json (or gate_draft.json): question / search_protocol / gates / matrix / novelty / assumptions / claims / conflicts / research_gap / decision"
  unusable_files: "binary / empty / corrupt JSON / placeholder-only files are recorded with a parse_status and never quoted"

required_outputs:
  - result.json
  - decision_brief.md
  - gate_scorecard.json
  - prior_art_alignment_matrix.csv
  - assumption_register.json
  - evidence_index.jsonl
  - conflicts.json
  - coverage.json
  - self_check.json
  - change_log.json
  - search_log.json
  - uncertainty.json
  - gain_evidence.json
  - run_log.txt
  - evidence/sources_snapshot.json

reusable_templates:
  - templates/deliverable_templates.md   # alignment-matrix long-table skeleton + evidence-table skeleton
  - README.md                            # Appendix A: rule anchor table (each rule -> M#/p# locator)
  - SELFTEST.md                          # section 5: benchmark & gain measurement protocol

runtime:
  network: false
  clock: false
  deterministic: true
  stdlib_only: true
  offline: true
  exit_code: "0 (all degradation paths; only argparse usage error returns 2)"

budget:
  wall_clock_seconds: 300
  max_output_files: 24
  max_output_bytes: 4194304

contract:
  keys: [case_id, status, deliverable, evidence_map, change_log, coverage]
  keys_from: "case.json:output_contract -> task.md:output_contract -> challenges/<key>.json -> SKILL.md json sample -> default keys"
  echo: "every contract key written both at top level and inside result.json.output_contract; case_id passed through unchanged"
  placeholders: forbidden

dependencies: []            # standard library only
exit_code_policy: always 0 (usage error 2)
