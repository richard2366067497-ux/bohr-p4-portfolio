# environment/resources.yaml — experiment-04 / plan-choice-sensitivity (v10)
# 资源入口声明。纯标准库、离线、确定性；不读网络、不读时钟。
skill: plan-choice-sensitivity
version: 2.6.0
lang: python
python: ">=3.9"

entry:
  single_command: >-
    python3 /skills/weekly-skill/scripts/main.py all
    --input /input --output /app/output --work /app/work
  agent_first:
    - python3 /skills/weekly-skill/scripts/main.py init --input /input --output /app/output --work /app/work
    - python3 /skills/weekly-skill/scripts/main.py show --input /input --work /app/work
    - "Agent: read the locators, write /app/work/draft.json (see SKILL.md §3)"
    - python3 /skills/weekly-skill/scripts/main.py check --input /input --work /app/work
    - python3 /skills/weekly-skill/scripts/main.py build --input /input --output /app/output --work /app/work
  selftest: >-
    python3 /skills/weekly-skill/scripts/main.py selfcheck
    --input /input --output /app/output --work /app/work

scripts:
  - scripts/main.py      # CLI：all / init / show / check / build / selfcheck（单命令 all = 全流程）
  - scripts/extract.py   # 物料解析：准则字典/状态映射/等级/公式/候选工作簿/约束/台账/假设，逐条带 locator+quote
  - scripts/engine.py    # 受限表达式求值、min-max 归一化、加权评分、支配关系、硬约束闸门、成本工期台账、翻转阈值扫描
  - scripts/render.py    # 产物渲染（决策备忘/markdown/契约键回填）

paths:
  input: /input
  output: /app/output
  work: /app/work
  skill_root: /skills/weekly-skill

inputs:
  material_roles_by_extension:
    ".json": "结构化材料（case.json、candidates/plans、constraints、cost_time、assumptions、risks、selected）"
    ".md"/".txt": "文字材料（准则字典 pipe 表：id/name/unit/direction/weight/why；状态映射表；等级表；成本/工期公式行）"
  discovery: "walk 输入目录；准则字典来自 pipe 表，候选/约束/台账/假设按 JSON 键名识别；缺料降级并如实记 limits"

required_outputs:
  - result.json
  - decision_memo.md
  - criteria_matrix.json
  - flip_report.json
  - cost_ledger.json
  - evidence.json
  - version_diff.md

runtime:
  network: false
  clock: false
  deterministic: true
  stdlib_only: true
  offline: true
  exit_code: "0（所有降级路径；仅 argparse 用法错误返回 2）"

budget:
  wall_clock_seconds: 120
  max_output_files: 24
  max_output_bytes: 4194304

contract:
  keys: [case_id, status, decision_memo, criteria_matrix, flip_report, cost_ledger, evidence, uncertainties, selected]
  keys_from: "case.json:output_contract -> task.md:output_contract -> tasks/<key>.json -> SKILL.md json 样例 -> 默认产物键"
  echo: "每个契约键既写在顶层，也写进 result.json.output_contract；status 取 answered/partial/insufficient_evidence/input_error 之一"
  placeholders: forbidden

dependencies: []            # 仅 Python 标准库；无第三方包
exit_code_policy: always 0 (usage error 2)
