# environment/resources.yaml — research-file-locator (library-02 · v9)
# 运行环境与资源声明；路径一律走 --input/--out/--work，脚本不从这里取路径。
runtime:
  language: python
  version: ">=3.8"
  tested_on: "CPython 3.12"
  package_manager: none
  dependencies: []          # 纯标准库：argparse, json, re, os, sys, time, hashlib, zipfile, zlib, io, math, pathlib, unicodedata
  network: false
  clock: false              # 交付物字节稳定；work/run.log 只记相对耗时
resources:
  cpu: 1
  memory_mb: 256
  timeout_s: 900
  model_requests: 64
  max_tokens_per_request: 16384
  max_files_on_disk: 400
  max_depth: 8
paths:
  input: /input
  output: /app/output
  work: /app/work
  skill: /skills/weekly-skill
entry:
  single_command: "python3 -B /skills/weekly-skill/scripts/main.py all --input /input --out /app/output --work /app/work"
  agent_path: [init, show, check, build, selfcheck, fixtures]
input_formats: [pdf, docx, xlsx, pptx, csv, tsv, txt, md, html, json, yaml, yml, doc, xls, ppt]
output_files: [result.json, index.json, answers.json, hits.jsonl, dedupe.json, failures.json,
               filters_log.json, location_report.md, verify_report.json]
locator_grammar: "path#<section_id>-<paragraph_id>@page_physical"
tunable_without_code_change:
  - case.json → filters / synonyms / materials_root   # 硬过滤维度、同义扩展与库根均由案例声明
  - case.json → output_contract                       # 契约键以案例为准，本包仅声明默认十键
