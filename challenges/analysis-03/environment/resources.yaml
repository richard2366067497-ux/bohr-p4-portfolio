# 运行时与资源清单（figure-publisher v7）
runtime:
  language: python
  python: "3.10+"
  dependencies: []            # 纯标准库：argparse csv json sqlite3 hashlib re pathlib
  network: false
  deterministic: true
  entry: "python3 /skills/weekly-skill/scripts/engine.py all --input /input --output /app/output --work /app/work"
  exit_code: 0                # 无论输入是否完整/合法，恒为 0

paths:
  skill: /skills/weekly-skill
  input: /input
  output: /app/output
  work: /app/work

input:
  optional:
    - name: case.json
      purpose: case_id 与 output_contract（存在即回填）
    - name: "*.csv | *.tsv | *.json | *.jsonl | *.db | *.sqlite"
      purpose: 待渲染的数据表
  accepts_empty: true
  accepts_malformed: true

output:
  - figure_report.md
  - stats.json
  - figure_data.json
  - figures/figure_1.svg
  - figures/figure_1.pdf
  - figures/figure_code.py
  - result.json

limits:
  max_files: 8
  max_total_kb: 150
  max_file_kb: 30
  output_clean_of_placeholders: true

render:
  svg: true
  pdf: true                   # base-14 Helvetica 矢量 PDF，可 pdftoppm/convert 栅格化
  chart_types: [bar, line, scatter]
