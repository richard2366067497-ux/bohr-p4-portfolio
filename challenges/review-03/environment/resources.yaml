# environment/resources.yaml - review-03 / method-statistics-audit (v9)
# Resource entry declaration. Pure standard library, offline, deterministic, exit code 0.
skill: method-statistics-audit
version: 1.0.0
lang: python
python: ">=3.9"

license:
  spdx: MIT
  use_conditions: "reusable for any Agent or human; keep the locator + verbatim-quote discipline; do not assert a manuscript defect from a rule table"

entry:
  single_command: >-
    python3 /skills/weekly-skill/scripts/main.py all
    --input /input --output /app/output --work /app/work
  agent_first:
    - python3 /skills/weekly-skill/scripts/main.py init --input /input --output /app/output --work /app/work
    - "Agent: run show, read each quotable line with its M02/p24 locator, optionally write /app/work/draft.json"
    - python3 /skills/weekly-skill/scripts/main.py check --input /input --output /app/output --work /app/work
    - python3 /skills/weekly-skill/scripts/main.py build --input /input --output /app/output --work /app/work
    - python3 /skills/weekly-skill/scripts/main.py selfcheck --output /app/output --work /app/work
    - python3 /skills/weekly-skill/scripts/main.py compare --input /input --output /app/output --work /app/work
  selftest: >-
    python3 /skills/weekly-skill/scripts/main.py selfcheck
    --output /app/output --work /app/work

scripts:
  - scripts/main.py       # CLI: all / init / show / check / build / selfcheck / compare (all = full pipeline)
  - scripts/auditlib.py   # engine + io: scan / rule parsing / locate / ledger / coverage / evidence / result

paths:
  input: /input
  output: /app/output
  work: /app/work
  skill_root: /skills/weekly-skill

inputs:
  case: "case.json (case_id, language, materials_root, optional output_contract)"
  materials: "materials/** text or json; task scaffolding (case.json / task.md / README) is indexed but never quoted"
  draft: "optional /app/work/draft.json with manuscript_meta, statistics_ledger, extra_findings, unchecked_items"
  unusable_files: "binary / empty / no-data-only / corrupt-json files are recorded with a parse_status and never quoted"

required_outputs:
  - result.json
  - audit_report.md
  - statistics_ledger.json
  - findings.json
  - coverage.json
  - evidence_map.json
  - change_log.json
  - index.json
  - self_check.json
  - boundary_log.json
  - run_log.txt
  - gain_report.json
  - gain_report.md

reusable_templates:
  - references/review_checklist.md
  - references/defect_types_and_severity.md
  - templates/draft_template.json
  - SKILL.md#section-0   # the json output_contract sample doubles as the no-contract fallback contract

runtime:
  network: false
  clock: false
  deterministic: true
  stdlib_only: true
  offline: true
  exit_code: "0 (all degradation paths; only argparse usage error returns 2)"

budget:
  wall_clock_seconds: 300
  max_output_files: 32
  max_output_bytes: 8388608

contract:
  keys: [case_id, status, deliverable, findings, ledger, coverage, evidence_map, change_log]
  keys_from: "case.json:output_contract -> task.md:output_contract -> challenges/<key>.json -> SKILL.md json sample -> default keys"
  echo: "every contract key written both at top level and inside result.json.output_contract; case_id passed through unchanged"
  issue_type_keys: "when the case contract names an issue_type, its located rule row is echoed (never a manuscript defect)"
  placeholders: forbidden

dependencies: []            # standard library only
exit_code_policy: always 0 (usage error 2)
