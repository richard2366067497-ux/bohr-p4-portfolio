# environment/resources.yaml · literature-evidence-qa

skill: literature-evidence-qa
version: 7.0.0
runtime:
  language: python
  min_version: "3.8"
  dependencies: []          # 纯标准库
  network: false
  clock: false
entry:
  command: "python3 /skills/weekly-skill/scripts/engine.py all --input /input --output /app/output --work /app/work"
  positional: all
  flags: [--input, --output, --work]
paths:
  input: /input
  output: /app/output
  work: /app/work
inputs:
  - /input/case.json                   # case_id / paper_id / material_version / questions
  - /input/task.md                     # 题目与可选问题清单
  - /input/comparison-workorder.json   # research_question / documents
  - /input/corpus/*.txt                # 论文正文段落
outputs:
  - result.json
  - answers.md
  - evidence_map.json
  - coverage.json
defaults:
  max_evidence_per_question: 3
  empty_input_status: insufficient_evidence
  error_status: input_error
budget:
  model_requests: 64
  seconds: 900
  tokens_per_response: 16384
