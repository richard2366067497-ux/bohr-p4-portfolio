# environment/resources.yaml — search-09 · literature-appraisal-benchmark (v9)
runtime:
  language: python
  version: ">=3.8"
  interpreter_hint: "python3 on PATH inside the skill image; the engine is version-agnostic"
  argv_style: "python3 scripts/main.py <subcommand> --input --output --work"
dependencies:
  third_party: []
  standard_library_only: true
  note: "no pip install, no network, no clock; the run is deterministic and offline"
network:
  required: false
  endpoints: []
filesystem:
  input: "/input           # case.json / task.md / materials/*  (the checklist corpus)"
  work: "/app/work         # optional draft.json, compare_report.json, analysis_state.json"
  output: "/app/output      # result.json + all deliverables + evidence/"
  read_only: ["/skills/weekly-skill"]
limits:
  max_files_in_package: 12
  max_total_bytes: 150000
  max_single_file_bytes: 30000
  exit_code: "0 on success, 1 on failure, 2 only for an argparse usage error"
budgets:
  model_requests: 64
  seconds: 900
  tokens_per_response: 16384
  note: "recorded by the platform; this package invents no benchmark score"
license:
  spdx: MIT
  note: >
    MIT License. Permission is hereby granted, free of charge, to any person obtaining a copy of
    this software and associated documentation files, to deal in the software without restriction,
    including the rights to use, copy, modify, merge, publish, distribute, sublicense and/or sell
    copies. THE SOFTWARE IS PROVIDED "AS IS", WITHOUT WARRANTY OF ANY KIND. The copyright notice
    is retained in this file; no separate LICENSE file is shipped to stay within the 12-file limit.
provenance:
  challenge: search-09
  skill: literature-appraisal-benchmark
  version: 1.0.0
