# environment/resources.yaml — writing-11 / manuscript-revision-desk
# 资源入口声明。纯标准库、离线、确定性；不读网络、不读时钟、不写全局状态。
skill: manuscript-revision-desk
version: 2.0.0
lang: python
python: ">=3.9"

entry:
  single_command: >-
    python3 /skills/weekly-skill/scripts/main.py all
    --input /input --output /app/output --work /app/work
  agent_first:
    - python3 /skills/weekly-skill/scripts/main.py init  --input /input --output /app/output --work /app/work
    - python3 /skills/weekly-skill/scripts/main.py show  --input /input --output /app/output --work /app/work
    - "Agent: read anchored paragraphs, write /app/work/draft.json (segments[])"
    - python3 /skills/weekly-skill/scripts/main.py check --input /input --output /app/output --work /app/work
    - python3 /skills/weekly-skill/scripts/main.py build --input /input --output /app/output --work /app/work
    - python3 /skills/weekly-skill/scripts/main.py selfcheck --input /input --output /app/output --work /app/work

scripts:
  - scripts/main.py     # 入口：发现→锚点→注记→修订稿→证据→版本控制→契约回填（all/init/show/check/build/selfcheck）
  - scripts/pipeline.py # 流水线编排：段落解析、注记生成、渲染、版本比对与重放
  - scripts/core.py     # 纯函数：定位、逐字核验、哈希、契约回填（无副作用）

paths:
  input: /input
  output: /app/output
  work: /app/work
  skill_root: /skills/weekly-skill

inputs:
  case_json:
    case_id: optional        # case_id / caseId / id，原样透传；缺失记降级
    output_contract: optional  # 缺失时用 SKILL.md §0 的默认 7 键
    task_instruction: optional
  workorder: optional        # organizer-edit-workorder.json：target_ids[] / operation_requirements / authority
  chapters: "chapters/*.md|*.markdown|*.txt（段落锚点 <!-- C01-P002 -->）"
  discovery: "walk 输入目录；角色由名称决定；缺失物料即降级而非报错"
  skip: [case.json, task.md, README.md, draft.json]

required_outputs:
  - result.json
  - revised_manuscript.md
  - evidence_map.json
  - preserved_facts.json
  - change_log.json
  - version_compare.md
  - operation_log.json
  - task_receipt.json
  - export_preview.md
  - original_snapshot.json
  - manifest.json
  # selfcheck 额外写：verify_report.json

runtime:
  network: false
  clock: false
  deterministic: true
  stdlib_only: true
  offline: true
  exit_code: "0（所有降级路径；仅 argparse 用法错误返回 2）"

budget:
  wall_clock_seconds: 60
  max_output_files: 16
  max_output_bytes: 1048576

contract:
  keys: [case_id, status, deliverable, preserved_facts, evidence_map, change_log, uncertainties]
  keys_from: "case.json:output_contract -> SKILL.md §0 默认 7 键（CANON）"
  echo: "每个契约键既写顶层，也写 result.json.output_contract"
  placeholders: forbidden

dependencies: []            # 仅 Python 标准库；无第三方包
exit_code_policy: always 0 (usage error 2)
