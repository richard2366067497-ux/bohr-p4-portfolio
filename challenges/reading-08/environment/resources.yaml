# Resource declaration for the formula-verification weekly skill.
# Everything runs locally on the Python standard library; nothing is fetched.
skill: formula-verification
version: 3.0.0
runtime:
  language: python
  minimum: "3.9"
  entry: scripts/main.py
  self_locating: true
  working_dir: package root (resolved from __file__)
paths:
  install: /skills/weekly-skill
  input: /input
  output: /app/output
  work: /app/work
  default_input: /input
  default_output: /app/output
  default_work: /app/work
commands:
  single: "python3 -B /skills/weekly-skill/scripts/main.py --input /input --output /app/output --work /app/work"
  build: "python3 -B /skills/weekly-skill/scripts/main.py build --input /input --output /app/output --work /app/work"
  check: "python3 -B /skills/weekly-skill/scripts/main.py check --input /input --output /app/output --work /app/work"
  selfcheck: "python3 -B /skills/weekly-skill/scripts/main.py selfcheck --input /input --output /app/output --work /app/work"
  show: "python3 -B /skills/weekly-skill/scripts/main.py show --input /input --output /app/output --work /app/work"
dependencies:
  third_party: []
  network: false
  external_models: false
  standard_library:
    - argparse
    - csv
    - hashlib
    - io
    - json
    - os
    - pathlib
    - re
    - sys
    - time
    - traceback
    - xml.etree.ElementTree
inputs:
  required:
    - case.json (optional; provides case_id and output_contract)
  accepted_materials: [xml, mathml, txt, md, tex]
  dedupe: sha1
outputs:
  main:
    - result.json
    - formulas.tex
    - symbol_table.csv
    - verification.md
    - run.log
  work:
    - work/index.json
budgets:
  wall_seconds: 60
  model_requests: 0
  memory_mb: 256
limits:
  - no symbolic algebra or simplification
  - no unit conversion
  - unprinted values stay unvalued
