# environment/resources.yaml - search-01 / traceable-literature-retrieval (v10)
# Resource entry declaration. Pure standard library, offline, deterministic.
skill: traceable-literature-retrieval
version: 1.0.0
lang: python
python: ">=3.9"

entry:
  single_command: >-
    python3 -B /skills/weekly-skill/scripts/main.py
    --input /input --output /app/output --work /app/work
  agent_first:
    - python3 -B /skills/weekly-skill/scripts/main.py init   --input /input --output /app/output --work /app/work
    - "Agent: run show, read the materials with their M01#n locators, optionally write /app/work/draft.json"
    - python3 -B /skills/weekly-skill/scripts/main.py check  --input /input --output /app/output --work /app/work
    - python3 -B /skills/weekly-skill/scripts/main.py build  --input /input --output /app/output --work /app/work
    - python3 -B /skills/weekly-skill/scripts/main.py selfcheck --output /app/output --work /app/work
    - python3 -B /skills/weekly-skill/scripts/main.py compare --input /input --output /app/output --work /app/work
  selftest: >-
    python3 -B /skills/weekly-skill/scripts/main.py selfcheck
    --output /app/output --work /app/work

scripts:
  - scripts/main.py       # CLI: all (default) / init / show / check / build / selfcheck / compare

paths:
  input: /input
  output: /app/output
  work: /app/work
  skill_root: /skills/weekly-skill

inputs:
  case_json: "case.json provides case_id, language, materials_root and output_contract (keys echoed verbatim)"
  task_md: "task.md provides the research question / task instruction when case.json does not"
  records_material: "a json/jsonl/csv/tsv material whose records may be under records/results/candidates/papers/items/documents/entries/data, a top-level array, or one object per line"
  prose_material: "md/txt materials are indexed as quotable lines with a source_id#L{line} locator (never quoted as literature)"
  unusable_files: "binary / empty / placeholder-only files are recorded with a parse_status and never quoted"

required_outputs:
  - result.json
  - candidates.jsonl
  - queries.jsonl
  - screening.json
  - coverage.json
  - report.md
  - selfcheck.json
  - run_log.txt
  - gain_report.json
  - gain_report.md

reusable_templates:
  - references/retrieval-guide.md
  - examples/expected_output.json

runtime:
  network: false
  clock: false
  deterministic: true
  stdlib_only: true
  offline: true
  exit_code: "0 (all degradation paths; only argparse usage error returns 2)"

budget:
  wall_clock_seconds: 300
  max_output_files: 24
  max_output_bytes: 4194304

contract:
  keys: [case_id, status, candidates, queries, coverage, missing, sources, uncertainty, change_records]
  keys_from: "case.json:output_contract -> task.md:output_contract -> challenges/<key>.json -> SKILL.md json sample -> default keys"
  echo: "every contract key written both at top level and inside result.json.output_contract; case_id passed through unchanged"
  empty_lists: "rendered as {\"count\":0,\"items\":[],\"note\":\"...\"} instead of an empty list"
  placeholders: forbidden

dependencies: []            # standard library only
exit_code_policy: always 0 (usage error 2)
