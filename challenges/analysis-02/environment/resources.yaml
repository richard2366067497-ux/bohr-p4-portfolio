# Resource entry point — stats-decision-ledger (analysis-02, v10)
schema: resource-entry/v1
skill: stats-decision-ledger
entry:
  command: python3 /skills/weekly-skill/scripts/main.py all
  arguments: ["--input /input", "--output /app/output", "--work /app/work"]
  exit_code_expected: 0
  alternatives: [init, build, selfcheck, compare, show, check]
references: [references/expert_playbook.md]   # 六步门控/决策树/公式/陷阱/locator/19 项自查表
examples: {dir: examples, data: examples/sample_data.csv, expected: "status=ok, 6 questions, 15 ledger rows, 25 evidence rows, 5 figures"}
runtime: {language: python3, version: ">=3.8", third_party: none, network: false, clock: false, model_calls: 0}
budget: {max_requests: 64, max_seconds: 900, max_tokens: 16384}
limits:
  files_per_material_scan: 60  # further files are indexed and left unread
  bytes_per_file: 500000       # a larger file is read up to the cap; truncation is reported
  normality_min_n: 8           # below eight per group only rank and descriptive methods run
  bootstrap_draws: 1000
inputs:
  - {path: /input/case.json, required: false, note: "case_id, language, materials_root, output_contract (authoritative); challenge.json accepted"}
  - {path: /input, required: true, note: "csv, tsv, json, jsonl, sqlite, md or txt; anything else snapshotted and named"}
  - {path: /app/work/draft.json, required: false, note: "data_plan and items; recomputed gates always win"}
outputs:
  [result.json, cleaned_data.csv, statistics_table.csv, results_ledger.json, evidence.json,
   decision_log.json, input_manifest.json, reproducibility.json, report.md, report.pdf, self_check.json]
workdir: /app/work
degradation:
  missing_input: status=insufficient_evidence, every contract key computed=false with a reason, exit 0
  unreadable_material: snapshotted, named in the manifest, nothing guessed
  no_analysable_data: empty ledger, triggers recorded, all eleven artifacts still written
  bad_draft: rejected field by field into change_records, documented defaults applied
