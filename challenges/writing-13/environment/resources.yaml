# Resource entry declaration — academic-writing-benchmark-builder (writing-13)
skill: academic-writing-benchmark-builder
version: 2.0.0
entrypoint:
  command: python3 /skills/weekly-skill/scripts/main.py run --input /input --output /app/output --work /app/work
  script: scripts/main.py
  argument: run              # subcommands: init | check | build | run
  reads:  /input             # case.json + materials/ (md, txt, json, csv, docx, pdf)
  writes: /app/output        # deliverable.md, tasks.jsonl, anchors.md, scores*.csv, reports, result.json
  scratch: /app/work         # answers.json (optional Agent input), run.log, version_state.json
  exit_code: 0               # always 0 except argparse usage error (2)

paths:
  input: /input
  out: /app/output
  work: /app/work
  install_root: /skills/weekly-skill

resources:
  network: none              # fully offline; no retrieval, no package download
  packages: none             # Python 3.9+ standard library only
  python: ">=3.9"
  optional_tools: [pdftotext]  # only used to read PDF materials; flate fallback built in

inputs:
  case_json:
    case_id: optional        # falls back to id / challenge_id / input directory name
    language: en | zh        # controls the generated instruction language
    output_contract: optional  # when absent, the five standard keys in SKILL.md §7 are used
  materials: md | txt | json | csv | tsv | docx | pdf
  skip: [case.json, task.md, draft.json, answers.json]

budgets:
  wall_clock_seconds: 900
  requests: 64
  tokens: 16384

security:
  shell: never               # no shell execution of input content; pdftotext is argv-only
  external_scripts: never
  write_scope: [out, work]   # never rewrites the input tree
