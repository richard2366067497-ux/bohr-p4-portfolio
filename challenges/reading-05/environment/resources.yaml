# Resource declaration for the reading-client weekly skill.
# Everything runs locally on the Python standard library; nothing is fetched.
skill: reading-client
version: 3.0.0
runtime:
  language: python
  minimum: "3.9"
  entry: scripts/main.py
  self_locating: true
  working_dir: package root (resolved from __file__)
paths:
  install: /skills/weekly-skill
  input: /input
  output: /app/output
  work: /app/work
  default_input: /input
  default_output: /app/output
  default_work: /app/work
commands:
  single: "python3 -B /skills/weekly-skill/scripts/main.py --input /input --output /app/output --work /app/work"
  build: "python3 -B /skills/weekly-skill/scripts/main.py build --input /input --output /app/output --work /app/work"
  check: "python3 -B /skills/weekly-skill/scripts/main.py check --input /input --output /app/output --work /app/work"
  selfcheck: "python3 -B /skills/weekly-skill/scripts/main.py selfcheck --input /input --output /app/output --work /app/work"
  show: "python3 -B /skills/weekly-skill/scripts/main.py show --input /input --output /app/output --work /app/work --doc D1"
dependencies:
  third_party: []
  network: false
  external_models: false
  standard_library:
    - argparse
    - hashlib
    - html
    - json
    - os
    - pathlib
    - re
    - sys
    - time
    - traceback
    - zipfile
    - zlib
inputs:
  required:
    - case.json (optional; provides case_id and output_contract)
    - task.md (optional; used as a stable source quote)
  accepted_materials: [txt, md, csv, tsv, json, tex, xml, html, pdf, docx]
  dedupe: sha1
outputs:
  main:
    - result.json
    - reading_record.md
    - golden_standard.json
    - diff_report.md
    - version_history.md
    - self_check.json
    - run.log
  reader:
    - reader/anchors.json
    - reader/annotations.json
    - reader/qa_log.json
    - reader/reading_state.json
    - reader/index.html
references:
  - references/expert_playbook.md   # 执行前必读：七步框架/可比性分级/公式/容差/陷阱/交付物/防扣分自查表
  - references/client_contract.md   # 契约键语义、locator 方案、选句与状态口径
examples:
  dir: examples
  case: examples/case.json
  material: examples/materials/paper.txt
  expected: "status=answered（含量化结论，可锚定出证据跨度）"
budgets:
  wall_seconds: 60
  model_requests: 0
  memory_mb: 256
limits:
  - no OCR for scanned PDFs
  - no semantic judgement of the material
  - answers are verbatim spans only
