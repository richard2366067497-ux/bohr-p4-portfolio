# environment/resources.yaml - research-02 / lit-review-workbench (v9)
# Resource entry declaration. Pure standard library, offline, deterministic.
skill: lit-review-workbench
version: 1.0.0
lang: python
python: ">=3.9"

entry:
  single_command: >-
    python3 /skills/weekly-skill/scripts/main.py all
    --input /input --output /app/output --work /app/work
  agent_first:
    - python3 /skills/weekly-skill/scripts/main.py init --input /input --output /app/output --work /app/work
    - "Agent: run show, read materials with locators, optionally write /app/work/draft.json"
    - python3 /skills/weekly-skill/scripts/main.py check --input /input --output /app/output --work /app/work
    - python3 /skills/weekly-skill/scripts/main.py build --input /input --output /app/output --work /app/work
  selftest: >-
    python3 /skills/weekly-skill/scripts/main.py selfcheck
    --output /app/output --work /app/work

scripts:
  - scripts/main.py       # CLI: all / init / show / check / build / selfcheck (single command all = full pipeline)

paths:
  input: /input
  output: /app/output
  work: /app/work
  skill_root: /skills/weekly-skill

inputs:
  material_roles_by_extension:
    ".md"/".txt"/".rst": "prose material, split into paragraphs with locators"
    ".json"/".jsonl": "structured records (records/sources/items/papers/documents/entries arrays)"
    ".csv"/".tsv": "tabular records"
    ".pdf"/".docx"/".xlsx": "binary, indexed by size only (parse_status=unparsed-binary)"
  discovery: "walk the input directory; unusable or empty files are recorded with a parse_status, never quoted"

required_outputs:
  - result.json
  - draft.md
  - evidence_matrix.json
  - screening_log.csv
  - coverage_report.json
  - conflicts_and_gaps.md
  - audit_report.md
  - run_log.txt

reusable_templates:
  - templates/evidence_matrix.csv
  - templates/screening_log.csv
  - templates/outline.json

runtime:
  network: false
  clock: false
  deterministic: true
  stdlib_only: true
  offline: true
  exit_code: "0 (all degradation paths; only argparse usage error returns 2)"

budget:
  wall_clock_seconds: 120
  max_output_files: 24
  max_output_bytes: 4194304

contract:
  keys: [case_id, status, review_draft, evidence_matrix, screening_log, coverage_report, conflicts_and_gaps, audit_report, uncertainties]
  keys_from: "case.json:output_contract -> task.md:output_contract -> challenges/<key>.json -> SKILL.md json sample -> default keys"
  echo: "every contract key written both at top level and inside result.json.output_contract; case_id passed through unchanged"
  placeholders: forbidden

dependencies: []            # standard library only
exit_code_policy: always 0 (usage error 2)
