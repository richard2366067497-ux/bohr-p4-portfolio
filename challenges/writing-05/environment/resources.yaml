# environment/resources.yaml — writing-05 / writing-05-evidence (v9)
# 资源入口声明。纯标准库、离线、确定性；不读网络、不读时钟、不写全局状态。
skill: writing-05-evidence
version: 1.1.0
lang: python
python: ">=3.9"

entry:
  single_command: >-
    python3 /skills/weekly-skill/scripts/main.py
    --input /input --output /app/output --work /app/work
  agent_first:
    - python3 /skills/weekly-skill/scripts/main.py --input /input --output /app/output --work /app/work
    - "Agent: read /app/output/evidence_table.json, optionally write /app/work/draft.json (evidence_overrides)"
    - python3 /skills/weekly-skill/scripts/main.py --input /input --output /app/output --work /app/work --draft /app/work/draft.json

scripts:
  - scripts/main.py     # 入口：读材料 → 切论断 → 匹配来源 → 判强度 → 渲染 + result.json
  - scripts/kit.py      # 纯函数：解析 / 分词相似度 / 设计分级 / 契约回填（无副作用）

paths:
  input: /input
  output: /app/output
  work: /app/work
  skill_root: /skills/weekly-skill

inputs:
  material_roles_by_name:
    "manuscript|draft|初稿|草稿": "待写/待改的稿件"
    "ref|bib|citation|literature|参考|文献": "可引用的来源材料"
    other: "普通材料；无名称线索时按普通材料处理"
  discovery: "walk 输入目录；角色由名称决定；缺失物料即降级而非报错"

required_outputs:
  - evidence_driven_draft.md
  - claims.json
  - evidence_table.json
  - evidence_strength.md
  - reference_check.md
  - uncertainty_notes.md
  - human_review.json
  - verification.json
  - diff_report.md
  - result.json

runtime:
  network: false
  clock: false
  deterministic: true
  stdlib_only: true
  offline: true
  exit_code: "0（所有降级路径；仅 argparse 用法错误返回 2）"

budget:
  wall_clock_seconds: 60
  max_output_files: 16
  max_output_bytes: 1048576

contract:
  keys: [case_id, deliverable, preserved_facts, evidence_map, change_log]
  keys_from: "case.json:output_contract -> SKILL.md 默认键（CANON）"
  echo: "每个契约键既写顶层，也写 result.json.output_contract"
  placeholders: forbidden

dependencies: []            # 仅 Python 标准库；无第三方包
exit_code_policy: always 0 (usage error 2)
